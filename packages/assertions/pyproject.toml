[project]
name = "assure-assertions"
version = "0.1.0"
description = "Deterministic invariant checks and verdict aggregation"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_assertions"]
