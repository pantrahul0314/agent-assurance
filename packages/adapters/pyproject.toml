[project]
name = "assure-adapters"
version = "0.1.0"
description = "HTTP adapters for the support demo target, fixtures, and observations"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_adapters"]
