[project]
name = "assure-runner"
version = "0.1.0"
description = "Customer-operated assure CLI runner"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "assure-adapters",
  "assure-assertions",
  "assure-reporting",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
assure = "assure_runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_runner"]
