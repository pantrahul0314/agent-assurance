[project]
name = "assure-contracts"
version = "0.1.0"
description = "Versioned assure schemas for cases, results, events, and control-plane DTOs"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_contracts"]
