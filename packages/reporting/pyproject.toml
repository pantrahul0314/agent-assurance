[project]
name = "assure-reporting"
version = "0.1.0"
description = "Local JSON, HTML, JUnit, and PDF report exporters"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_reporting"]
