[project]
name = "agent-assurance"
version = "0.1.0"
description = "Release-testing for tenant isolation in AI customer-support assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "assure-adapters",
  "assure-assertions",
  "assure-reporting",
  "assure-runner",
  "assure-demo",
  "assure-control-api",
  "assure-worker",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.uv.workspace]
members = [
  "packages/contracts",
  "packages/adapters",
  "packages/assertions",
  "packages/reporting",
  "packages/runner",
  "fixtures/support_demo",
  "apps/control_api",
  "apps/maintenance_worker",
]

[tool.uv.sources]
assure-contracts = { workspace = true }
assure-adapters = { workspace = true }
assure-assertions = { workspace = true }
assure-reporting = { workspace = true }
assure-runner = { workspace = true }
assure-demo = { workspace = true }
assure-control-api = { workspace = true }
assure-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
