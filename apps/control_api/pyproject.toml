[project]
name = "assure-control-api"
version = "0.1.0"
description = "Hosted control plane for assure runs, findings, and reports"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "assure-reporting",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.9",
  "cryptography>=43.0",
  "httpx>=0.27",
]

[project.scripts]
assure-api = "assure_control_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_control_api"]
