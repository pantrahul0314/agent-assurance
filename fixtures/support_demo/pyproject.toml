[project]
name = "assure-demo"
version = "0.1.0"
description = "Synthetic two-tenant support assistant with safe and vulnerable modes"
requires-python = ">=3.12"
dependencies = [
  "assure-contracts",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
assure-demo = "assure_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assure_demo"]
